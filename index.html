<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20150f"><title>Beginklank Tovenaar</title><link rel="stylesheet" href="./styles.css?v=20261013b"></head><body><main id="game" class="game"><div class="book"><img class="book-bg" src="./assets/boekstill.jpg" alt=""><section class="leftpage"><div class="autumn-decoration" aria-hidden="true"><span class="leaf leaf-one">🍁</span><span class="leaf leaf-two">🍂</span><span class="leaf leaf-three">🍁</span><span class="leaf leaf-four">🍂</span><span class="leaf leaf-five">🍄</span></div><div class="book-motto">spie spa spetter,<br>luister naar de 1e letter</div><div id="startPanel" class="start-panel"><h1>Beginklank Tovenaar</h1><p>Welke klank hoor je vooraan?</p><label for="mode">Welke woorden?</label><select id="mode"><option value="mix">Alle klanken door elkaar</option><option value="letter">Eén beginklank</option><option value="choose">Zelf woorden kiezen</option></select><div id="letterBox" class="hidden"><label for="letter">Beginklank</label><select id="letter"></select></div><div id="chooseBox" class="hidden"><label for="wordSearch">Kies afbeeldingen</label><input id="wordSearch" placeholder="Zoek een woord…" autocomplete="off"><div id="wordChoices" class="word-choices"></div><button id="allWords" class="small">Alles selecteren</button><button id="noWords" class="small">Alles wissen</button></div><label for="count">Aantal plaatjes</label><select id="count"><option value="5">5 plaatjes</option><option value="10" selected>10 plaatjes</option><option value="15">15 plaatjes</option><option value="all">Alle geselecteerde</option></select><label class="check"><input type="checkbox" id="sounds"> Magische geluiden</label><button id="startBtn" class="main-button">Open het toverboek ✨</button><p id="startNotice" class="notice" role="status"></p></div><div id="playingPanel" class="playing-panel hidden"><h2>Luister goed…</h2><p>Wat zie je?<br>Welke klank hoor je vooraan?</p><div id="progress" class="progress"></div><button id="backBtn" class="text-button">‹ Vorige</button><button id="homeBtn" class="text-button">⌂ Opnieuw beginnen</button></div></section><section class="rightpage"><div id="picturePanel" class="picture-panel hidden"><img id="picture" alt="" draggable="false"><div class="answer-slot"><div id="answer" class="answer" aria-live="polite"></div></div></div><div id="endPanel" class="end-panel hidden"><h2>Het toverboek is uit!</h2><p>Wat hebben jullie goed geluisterd!</p><button id="againBtn" class="main-button">Nog een keer</button></div></section><button id="actionBtn" class="action-button hidden" aria-label="Beginklank gezegd">Beginklank gezegd!</button><div id="turnLayer" class="turn-layer hidden" aria-hidden="true"><video id="turnVideo" playsinline muted preload="auto" src="./assets/boekanimatie.mp4"></video></div></div></main><script src="./words.js"></script><script src="./app.js?v=20261013b"></script></body></html>
